{% extends 'base.html' %} 
{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4">Criar Conta</h3>
            <!--
              Mesma ideia do login: sem method/action, quem envia é o
              JavaScript (static/js/auth.js), via fetch, para
              POST /api/v1/auth/registro.
            -->
            <div id="cadastro-erro" class="alert alert-danger d-none" role="alert"></div>
            <form id="form-cadastro">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required />
              </div>
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Cadastrar
              </button>
            </form>
            <div class="mt-3 text-center">
              <span>Já tem conta?
                <a href="{{ url_for('usuarios.login') }}">Entrar</a></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}

{% block extra_js %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock extra_js %}

{% extends 'base.html' %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-1">Redefinir senha</h3>
            <p class="text-muted mb-4">Escolha uma nova senha para sua conta.</p>
            <form method="POST">
              <div class="mb-3">
                <label for="senha" class="form-label">Nova senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="senha"
                  name="senha"
                  minlength="6"
                  placeholder="Mínimo 6 caracteres"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="confirmar_senha" class="form-label">Confirmar nova senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="confirmar_senha"
                  name="confirmar_senha"
                  minlength="6"
                  placeholder="Repita a senha"
                  required
                />
                <div id="senha-feedback" class="form-text text-danger d-none">
                  As senhas não coincidem.
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100" id="btn-redefinir">
                Redefinir senha
              </button>
            </form>
            <div class="mt-3 text-center">
              <a href="{{ url_for('usuarios.login') }}">Voltar para o login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Validação visual de confirmação de senha no lado do cliente
    const senhaInput = document.getElementById('senha');
    const confirmarInput = document.getElementById('confirmar_senha');
    const feedback = document.getElementById('senha-feedback');
    const btnRedefinir = document.getElementById('btn-redefinir');

    function validarSenhas() {
      if (confirmarInput.value && senhaInput.value !== confirmarInput.value) {
        feedback.classList.remove('d-none');
        btnRedefinir.disabled = true;
      } else {
        feedback.classList.add('d-none');
        btnRedefinir.disabled = false;
      }
    }

    senhaInput.addEventListener('input', validarSenhas);
    confirmarInput.addEventListener('input', validarSenhas);
  </script>
{% endblock content %}
